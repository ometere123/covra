[profile.default]
via_ir = true
src = "src"
test = "test"
out = "out"
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# Harness-only size exemption for the dependency-free, inlined test contract.
# The deployable CovraPools bytecode remains 12k bytes, below EIP-170 limit.
code_size_limit = 100000
