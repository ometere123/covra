name: COVRA quality gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:solidity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:genlayer-logic
      - run: python -m pip install genlayer-test==0.29.2
      - name: Verify pinned Bradbury runtime SDK
        run: |
          mkdir -p .runtime
          curl --fail --location --retry 3 https://github.com/genlayerlabs/genvm-manager/releases/download/v0.6.0-rc10/genvm-universal.tar.xz -o .runtime/genvm-universal.tar.xz
          python scripts/prepare-genvm-runtime.py
          npm run test:genlayer-direct
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge test --root contracts/base -vv
      - run: npm run build
