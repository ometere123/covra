name: COVRA quality gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:solidity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:genlayer-logic
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge test --root contracts/base -vv
      - run: npm run build
